services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Application services (single image, different -app) ----
  # Config: build/.env/.<app>.env (host-oriented localhost).
  # environment: only Docker DNS overrides (compose env wins over env_file).

  auth:
    build: .
    image: ecom:local
    container_name: auth
    command: ["-app", "auth"]
    ports:
      - "8081:8081"
    env_file:
      - ./build/.env/.auth.env
    environment:
      DB_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  user:
    build: .
    image: ecom:local
    container_name: user
    command: ["-app", "user"]
    ports:
      - "8082:8082"
    env_file:
      - ./build/.env/.user.env
    environment:
      DB_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  payment:
    build: .
    image: ecom:local
    container_name: payment
    command: ["-app", "payment"]
    ports:
      - "50051:50051"
    env_file:
      - ./build/.env/.payment.env
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  notification:
    build: .
    image: ecom:local
    container_name: notification
    command: ["-app", "notification"]
    env_file:
      - ./build/.env/.notification.env
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  order:
    build: .
    image: ecom:local
    container_name: order
    command: ["-app", "order"]
    ports:
      - "8083:8083"
    env_file:
      - ./build/.env/.order.env
    environment:
      PAYMENT_SERVICE_ADDR: payment:50051
    depends_on:
      - payment
    restart: unless-stopped

  gateway:
    build: .
    image: ecom:local
    container_name: gateway
    command: ["-app", "gateway"]
    ports:
      - "8080:8080"
    env_file:
      - ./build/.env/.gateway.env
    environment:
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://user:8082
      ORDER_SERVICE_URL: http://order:8083
    depends_on:
      - auth
      - user
      - order
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./build/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - kafka
      - mariadb

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./build/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./build/monitoring/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  mariadb-data:
